<app-modal
  type="remove"
  size="sm"
  title="Delete Rule"
  confirmLabel="Delete"
  [confirmLoading]="loading()"
  (confirm)="confirmed.emit()"
  (cancelled)="closed.emit()"
>
  <p class="text-body-sm leading-relaxed text-on-surface">
    Delete rule "{{ rule().jsonPath }}" ({{ displayRuleId(rule().id) }})? This field will no longer be ignored during comparison.
  </p>
</app-modal>
