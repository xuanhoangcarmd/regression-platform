<div class="flex flex-col items-center justify-between gap-4 border-t border-outline-variant p-4 sm:flex-row">
  <span class="text-body-sm text-secondary"> Showing {{ rangeStart() }}-{{ rangeEnd() }} of {{ totalCount() }} </span>

  <div class="flex items-center gap-1">
    <button
      type="button"
      (click)="go(pageNumber() - 1)"
      [disabled]="pageNumber() <= 1"
      class="flex h-8 w-8 items-center justify-center rounded border border-outline-variant text-secondary transition-colors hover:bg-surface-container-low disabled:cursor-not-allowed disabled:opacity-50"
    >
      <mat-icon class="text-[18px]">{{ chevronLeftIcon }}</mat-icon>
    </button>

    @for (page of pages(); track $index) {
      @if (page === 'ellipsis') {
        <span class="px-2 text-secondary">...</span>
      } @else {
        <button
          type="button"
          (click)="go(page)"
          class="h-8 w-8 rounded text-body-sm transition-colors"
          [ngClass]="
            page === pageNumber()
              ? 'bg-primary-container font-medium text-on-primary'
              : 'border border-outline-variant text-secondary hover:bg-surface-container-low'
          "
        >
          {{ page }}
        </button>
      }
    }

    <button
      type="button"
      (click)="go(pageNumber() + 1)"
      [disabled]="pageNumber() >= totalPages()"
      class="flex h-8 w-8 items-center justify-center rounded border border-outline-variant text-secondary transition-colors hover:bg-surface-container-low disabled:cursor-not-allowed disabled:opacity-50"
    >
      <mat-icon class="text-[18px]">{{ chevronRightIcon }}</mat-icon>
    </button>
  </div>
</div>
